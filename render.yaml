services:
  - type: web
    name: matchpredict-ai-v22
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DERIV_OAUTH_CLIENT_ID
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: DERIV_OAUTH_SCOPE
        value: trade
      - key: SESSION_SECRET
        generateValue: true
